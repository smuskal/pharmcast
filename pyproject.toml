[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pharmcast"
version = "0.1.0"
description = "Predict a 3D pharmacophore fingerprint directly from a 2D structure"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
  { name = "Steven M. Muskal" },
  { name = "Malcolm J. McGregor" },
]
keywords = ["cheminformatics", "pharmacophore", "fingerprint", "virtual screening", "rdkit"]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = ["numpy>=1.24", "torch>=2.0", "rdkit>=2023.3"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://pharmcast.ai"
Documentation = "https://pharmcast.ai"
Source = "https://github.com/smuskal/pharmcast"

[project.scripts]
pharmcast = "pharmcast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
