[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pharmcast"
version = "0.1.0"
description = "Predict a 3D pharmacophore fingerprint directly from a 2D structure"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
  { name = "Steven M. Muskal" },
  { name = "Malcolm J. McGregor" },
]
keywords = ["cheminformatics", "pharmacophore", "fingerprint", "virtual screening", "rdkit"]
classifiers = [
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Topic :: Scientific/Engineering :: Chemistry",
]
# numpy>=1.24: np.bitwise_count needs 2.0, but similarity.py falls back to a
# lookup table on 1.x rather than forcing an upgrade on users whose stack is
# pinned by some other dependency. torch is CPU-only here -- the model is 8 M
# parameters and a GPU buys nothing.
dependencies = ["numpy>=1.24", "torch>=2.0", "rdkit>=2023.3"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://pharmcast.ai"
Documentation = "https://pharmcast.ai"
Source = "https://github.com/smuskal/pharmcast"

[project.scripts]
pharmcast = "pharmcast.cli:main"
pfp2bits = "pharmcast.cli:pfp2bits_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
